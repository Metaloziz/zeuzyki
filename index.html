<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#081112" />
        <script>
            (function () {
                try {
                    var storageKey = "mantine-color-scheme-value";
                    var savedScheme = window.localStorage.getItem(storageKey);
                    var scheme =
                        savedScheme === "light" || savedScheme === "dark"
                            ? savedScheme
                            : "dark";

                    if (!savedScheme) {
                        window.localStorage.setItem(storageKey, "dark");
                    }

                    document.documentElement.setAttribute(
                        "data-mantine-color-scheme",
                        scheme
                    );
                } catch (_) {
                    document.documentElement.setAttribute(
                        "data-mantine-color-scheme",
                        "dark"
                    );
                }
            })();
        </script>
        <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
        <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
        <title>Zeuzyki — сплавы на байдарках</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
